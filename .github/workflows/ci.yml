name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --manifest-path server/Cargo.toml --all-features
      - name: Audit Rust dependencies
        run: |
          cargo generate-lockfile --manifest-path server/Cargo.toml
          cargo install cargo-audit --locked
          cargo audit --file server/Cargo.lock
